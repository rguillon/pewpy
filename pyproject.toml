[project]
name = "pewpy"
version = "0.0.1"
description = "Python based Shoott Them Up"
authors = [{ name = "Renaud Guillon", email = "renaud.guillon@gmail.com" }]
readme = "README.md"
keywords = ['python']
requires-python = ">=3.12,<4.0"

classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "numpy>=2.2.6",
    "panda3d>=1.10.16",
]

[project.urls]
Homepage = "https://rguillon.github.io/pewpy/"
Repository = "https://github.com/rguillon/pewpy"
Documentation = "https://rguillon.github.io/pewpy/"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pre-commit>=4.5.1",
    "tox-uv>=1.33.4",
    "deptry>=0.25.1",
    "ty>=0.0.24",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.7",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "mkdocstrings[python]>=1.0.3",
    "types-panda3d>=0.4.1",
    "setuptools>=84.0.0",
    "pip>=26.2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pewpy"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "pewpy/data"  # the game's data files (see pewpy/data.py)

[tool.ty.environment]
python = "./.venv"
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
fix = true

[tool.ruff.lint]
fixable = ["ALL"]
select = ["ALL", "RUF022"]
ignore = [  "COM812",   # cause incompatibility with the formatter
            "ISC001",   # cause incompatibility with the formatter
            "D203",     # conflict with another rule
            "D213",     # conflict with another rule
            "D107",     # ok to not document the constructors
            "TRY400",   # ok to not log exceptions
            "CPY001",   # No copyright
            "DOC201",   # Ok to not document returns
            "DOC501",   # Ok to not document exceptions
            "PLR2004",  # Magic values
            "PLR0913",  # Too many arguments: builders and generators take many parameters
            "PLR0917",  # Too many positional arguments: same
            "FBT001",   # Boolean-typed positional argument
            "FBT002",   # Boolean default positional argument
            "S311",     # We want pseudo-random, non cryptographic is ok
            ]

[tool.ruff.lint.per-file-ignores]
# Every motion, exit, action and landscape implements the same method; not all of them use every argument.
"src/pewpy/game/enemies/motions/*" = ["ARG002"]
"src/pewpy/game/enemies/exits/*" = ["ARG002"]
"src/pewpy/game/enemies/actions/*" = ["ARG002"]
"src/pewpy/scenery/ground/kinds/*" = ["ARG002"]
# The dev tools' command lines talk to the user with print, and so does the AI's training.
"src/pewpy/tools/*" = ["T201"]
"src/pewpy/ai/training/__main__.py" = ["T201"]
"tests/*" = [ "S101",     # Allow assert in tests
              "D100",     # No docstring in tests
              "D101",     # No docstring in tests
              "D102",     # No docstring in tests
              "D103",     # No docstring in tests
              "D105",     # No docstring in tests
              "D107",     # No docstring in tests
              "FBT001",   # Boolean-typed positional argument in function
              "PLR2004",  # Magic values ok in tests
              "SLF001",   # Accessing private members is ok in tests.
              "PLR0913",  # Too many arguments to function: needed for the MQTT lib
              "PLR0917",   # PLR0917 Too many positional arguments, good enough in test
              ]

[tool.ruff.format]
preview = true

[tool.coverage.report]
skip_empty = true
fail_under = 100  # every line and branch of the game (src/pewpy) is tested
show_missing = true
skip_covered = true

[tool.coverage.run]
branch = true
source = ["src/pewpy"]  # the game only: the dev tools (src/pewpy/tools) have no unit tests
omit = ["src/pewpy/tools/*"]
